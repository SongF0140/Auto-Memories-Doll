name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 不能加 --omit=optional：rollup 的平台二进制（@rollup/rollup-*-*) 也是
      # optionalDependencies，vitest 运行必需。usearch 在 optionalDependencies 中，
      # 原生安装失败时 npm 会自动跳过，代码侧降级到纯 JS HNSW shim（见
      # src/lib/vector/backend.ts 的 loadUsearch 降级逻辑）。
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm run test

      # 检索评测：无 MODEL_API_KEY 时走确定性本地 embedding 与关键词保底，
      # 生成 Recall@k / MRR 报告并作为产物上传，便于回归对比。
      - name: Retrieval eval
        run: npm run eval

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report-${{ matrix.os }}-node${{ matrix.node }}
          path: evals/reports/
          if-no-files-found: ignore
